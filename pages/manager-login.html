<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GROCERIA - Manager Login</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8f6;
        }

        .login-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .login-container {
            width: 900px;
            max-width: 100%;

            min-height: 520px;

            background: white;

            border: 1px solid #dce5df;

            border-radius: 10px;

            overflow: hidden;

            display: flex;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);
        }

        /* LEFT SIDE */

        .login-left {
            width: 42%;

            background: #075c43;

            color: white;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px;
        }

        .brand-logo {
            font-size: 25px;

            font-weight: bold;

            margin-bottom: 100px;
        }

        .cart-icon {
            font-size: 40px;

            margin-bottom: 15px;
        }

        .welcome-title {
            font-size: 27px;

            margin-bottom: 12px;
        }

        .welcome-text {
            font-size: 13px;

            color: #d9eee5;

            line-height: 1.6;
        }

        /* RIGHT SIDE */

        .login-right {
            width: 58%;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 45px;
        }

        .login-box {
            width: 100%;

            max-width: 390px;
        }

        .login-title {
            text-align: center;

            font-size: 23px;

            color: #222b26;

            margin-bottom: 30px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            font-size: 12px;

            color: #47534c;

            margin-bottom: 7px;

            font-weight: 600;
        }

        .form-input {
            width: 100%;

            height: 43px;

            border: 1px solid #d4ddd7;

            border-radius: 5px;

            padding: 0 13px;

            font-size: 13px;

            outline: none;

            background: #fafcfb;
        }

        .form-input:focus {
            border-color: #07864a;

            background: white;
        }

        /* PASSWORD */

        .password-row {
            position: relative;
        }

        .show-password {
            position: absolute;

            right: 12px;

            top: 13px;

            cursor: pointer;

            font-size: 13px;

            color: #69736d;
        }

        /* OPTIONS */

        .login-options {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: -5px;

            margin-bottom: 25px;

            font-size: 11px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 6px;

            color: #68726c;
        }

        .forgot-password {
            color: #087b45;

            text-decoration: none;
        }

        /* BUTTON */

        .login-button {
            width: 100%;

            height: 44px;

            border: none;

            border-radius: 5px;

            background: #087b45;

            color: white;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #066b3c;
        }

        /* BACK */

        .back-role {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #087b45;

            text-decoration: none;

            font-size: 11px;
        }

        .back-role:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .login-container {
                flex-direction: column;
            }

            .login-left,
            .login-right {
                width: 100%;
            }

            .login-left {
                min-height: 230px;
            }

            .brand-logo {
                margin-bottom: 25px;
            }

            .login-right {
                padding: 35px 25px;
            }

        }

    </style>
</head>


<body>

<div class="login-page">

    <div class="login-container">


        <!-- LEFT SIDE -->

        <div class="login-left">

            <div class="brand-logo">
                🛒 GROCERIA
            </div>

            <div class="cart-icon">
                🛒
            </div>

            <h1 class="welcome-title">
                Welcome Back!
            </h1>

            <p class="welcome-text">
                Please sign in to continue
                to your manager dashboard.
            </p>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-right">

            <div class="login-box">

                <h2 class="login-title">
                    Manager Login
                </h2>


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="form-input"
                        placeholder="Enter username">

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-row">

                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="Enter password">

                        <span
                            class="show-password"
                            onclick="togglePassword()">

                            👁

                        </span>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox">

                        Remember me

                    </label>


                    <a
                        href="#"
                        class="forgot-password">

                        Forgot Password?

                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    class="login-button"
                    onclick="managerLogin()">

                    Login

                </button>


                <!-- BACK -->

                <a
                    href="../index.html"
                    class="back-role">

                    ← Back to Role Selection

                </a>

            </div>

        </div>

    </div>

</div>


<script>

    function togglePassword() {

        const password =
            document.getElementById("password");

        if (password.type === "password") {

            password.type = "text";

        } else {

            password.type = "password";

        }

    }


    function managerLogin() {

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;


        if (username === "" || password === "") {

            alert(
                "Please enter username and password."
            );

            return;

        }


        alert(
            "Manager Login button is working! Backend will be connected later."
        );

    }

</script>

</body>

</html>
