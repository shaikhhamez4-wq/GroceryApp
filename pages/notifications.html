<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GROCERIA - Notifications</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f8f6;
    color: #26312b;
}

/* HEADER */

.top-header {
    height: 62px;
    background: #075c43;
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;
}

.brand {
    font-size: 21px;
    font-weight: bold;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 12px;
}

.profile {
    width: 34px;
    height: 34px;
    border-radius: 50%;

    background: white;
    color: #075c43;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
}

/* LAYOUT */

.layout {
    display: flex;
    min-height: calc(100vh - 62px);
}

/* SIDEBAR */

.sidebar {
    width: 225px;
    background: white;
    border-right: 1px solid #dce5df;

    padding: 20px 12px;
}

.sidebar-title {
    font-size: 10px;
    color: #89928c;

    text-transform: uppercase;

    padding: 0 12px 12px;
}

.menu {
    list-style: none;
}

.menu li {
    margin-bottom: 4px;
}

.menu a {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 11px 12px;

    text-decoration: none;

    color: #4d5952;

    border-radius: 6px;

    font-size: 13px;
}

.menu a:hover,
.menu a.active {
    background: #e6f5ec;
    color: #087b45;
}

.icon {
    width: 20px;
    text-align: center;
}

/* CONTENT */

.content {
    flex: 1;
    padding: 28px;

    max-width: 1200px;
}

.page-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 22px;
}

.heading h1 {
    font-size: 25px;
    margin-bottom: 6px;
}

.heading p {
    color: #7a847e;
    font-size: 13px;
}

/* MARK ALL */

.mark-button {
    border: 1px solid #d4ddd7;
    background: white;

    color: #087b45;

    border-radius: 5px;

    padding: 10px 15px;

    font-size: 11px;
    font-weight: bold;

    cursor: pointer;
}

.mark-button:hover {
    background: #e6f5ec;
}

/* SUMMARY */

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 16px;

    margin-bottom: 20px;
}

.summary-card {
    background: white;

    border: 1px solid #dce5df;

    border-radius: 8px;

    padding: 18px;
}

.summary-card p {
    color: #7a847e;
    font-size: 11px;

    margin-bottom: 8px;
}

.summary-card h2 {
    font-size: 22px;
}

/* NOTIFICATION BOX */

.notification-box {
    background: white;

    border: 1px solid #dce5df;

    border-radius: 8px;

    overflow: hidden;
}

/* FILTER */

.filter-bar {
    padding: 15px 20px;

    border-bottom: 1px solid #edf0ee;

    display: flex;
    gap: 8px;
}

.filter-button {
    border: 1px solid #dce5df;

    background: white;

    color: #59645e;

    border-radius: 20px;

    padding: 7px 14px;

    font-size: 10px;

    cursor: pointer;
}

.filter-button.active,
.filter-button:hover {
    background: #e6f5ec;

    color: #087b45;

    border-color: #b9dfc8;
}

/* NOTIFICATION */

.notification {
    display: flex;

    align-items: flex-start;

    gap: 15px;

    padding: 18px 20px;

    border-bottom: 1px solid #edf0ee;

    transition: 0.2s;
}

.notification:hover {
    background: #fafcfb;
}

.notification.unread {
    background: #f3faf6;
}

.notification:last-child {
    border-bottom: none;
}

/* ICON */

.notification-icon {
    width: 42px;
    height: 42px;

    min-width: 42px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 18px;
}

.stock-icon {
    background: #fff3cd;
}

.danger-icon {
    background: #fde8e8;
}

.payment-icon {
    background: #e6f5ec;
}

.sale-icon {
    background: #eef2ff;
}

.purchase-icon {
    background: #f3eafa;
}

.user-icon {
    background: #e8f0ff;
}

/* TEXT */

.notification-content {
    flex: 1;
}

.notification-title {
    font-size: 12px;

    font-weight: bold;

    margin-bottom: 5px;
}

.notification-message {
    font-size: 11px;

    color: #69746d;

    line-height: 1.5;

    margin-bottom: 6px;
}

.notification-time {
    font-size: 9px;

    color: #9aa39d;
}

/* DOT */

.unread-dot {
    width: 8px;
    height: 8px;

    background: #087b45;

    border-radius: 50%;

    margin-top: 5px;
}

/* DELETE */

.delete-button {
    border: none;

    background: transparent;

    color: #9aa39d;

    cursor: pointer;

    font-size: 16px;
}

.delete-button:hover {
    color: #b42318;
}

/* EMPTY */

.empty {
    display: none;

    text-align: center;

    padding: 60px 20px;

    color: #89928c;
}

.empty-icon {
    font-size: 35px;

    margin-bottom: 10px;
}

.empty h3 {
    color: #59645e;

    font-size: 15px;

    margin-bottom: 5px;
}

.empty p {
    font-size: 11px;
}

/* RESPONSIVE */

@media(max-width:900px) {

    .summary {
        grid-template-columns: 1fr;
    }

}

@media(max-width:700px) {

    .sidebar {
        width: 65px;
    }

    .sidebar-title,
    .menu span {
        display: none;
    }

    .menu a {
        justify-content: center;
    }

    .content {
        padding: 18px;
    }

    .page-heading {
        align-items: flex-start;
        gap: 15px;
        flex-direction: column;
    }

}

</style>
