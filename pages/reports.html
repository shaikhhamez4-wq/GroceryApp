<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GROCERIA - Reports</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f8f6;
    color: #26312b;
}

/* HEADER */

.top-header {
    height: 62px;
    background: #075c43;
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;
}

.brand {
    font-size: 21px;
    font-weight: bold;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 12px;
}

.profile {
    width: 34px;
    height: 34px;
    border-radius: 50%;

    background: white;
    color: #075c43;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
}

/* LAYOUT */

.layout {
    display: flex;
    min-height: calc(100vh - 62px);
}

/* SIDEBAR */

.sidebar {
    width: 225px;
    background: white;
    border-right: 1px solid #dce5df;

    padding: 20px 12px;
}

.sidebar-title {
    font-size: 10px;
    color: #89928c;

    text-transform: uppercase;

    padding: 0 12px 12px;
}

.menu {
    list-style: none;
}

.menu li {
    margin-bottom: 4px;
}

.menu a {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 11px 12px;

    text-decoration: none;

    color: #4d5952;

    border-radius: 6px;

    font-size: 13px;
}

.menu a:hover,
.menu a.active {
    background: #e6f5ec;
    color: #087b45;
}

.icon {
    width: 20px;
    text-align: center;
}

/* CONTENT */

.content {
    flex: 1;
    padding: 28px;

    overflow-x: auto;
}

.page-heading {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 22px;
}

.heading h1 {
    font-size: 25px;
    margin-bottom: 6px;
}

.heading p {
    color: #7a847e;
    font-size: 13px;
}

/* FILTERS */

.filters {
    background: white;

    border: 1px solid #dce5df;

    border-radius: 8px;

    padding: 18px;

    display: flex;

    align-items: end;

    gap: 15px;

    margin-bottom: 20px;
}

.filter-group label {
    display: block;

    font-size: 10px;

    color: #68736c;

    font-weight: bold;

    margin-bottom: 6px;
}

.filter-group input,
.filter-group select {
    height: 38px;

    min-width: 160px;

    border: 1px solid #d4ddd7;

    border-radius: 5px;

    padding: 0 10px;

    outline: none;

    font-size: 11px;

    background: white;
}

.filter-group input:focus,
.filter-group select:focus {
    border-color: #087b45;
}

.apply-button,
.export-button {
    height: 38px;

    border: none;

    border-radius: 5px;

    padding: 0 16px;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;
}

.apply-button {
    background: #087b45;
    color: white;
}

.export-button {
    background: #eef2ff;
    color: #4654a8;
}

/* SUMMARY */

.summary {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 16px;

    margin-bottom: 20px;
}

.summary-card {
    background: white;

    border: 1px solid #dce5df;

    border-radius: 8px;

    padding: 18px;
}

.summary-card p {
    color: #7a847e;

    font-size: 11px;

    margin-bottom: 10px;
}

.summary-card h2 {
    font-size: 22px;
}

.change {
    margin-top: 8px;

    font-size: 10px;

    color: #087b45;
}

/* REPORT GRID */

.report-grid {
    display: grid;

    grid-template-columns: 1.5fr 1fr;

    gap: 20px;

    margin-bottom: 20px;
}

.report-card {
    background: white;

    border: 1px solid #dce5df;

    border-radius: 8px;

    padding: 20px;
}

.report-card h3 {
    font-size: 15px;

    margin-bottom: 5px;
}

.report-card-subtitle {
    color: #89928c;

    font-size: 10px;

    margin-bottom: 20px;
}

/* BAR CHART */

.chart {
    height: 230px;

    display: flex;

    align-items: end;

    justify-content: space-around;

    border-bottom: 1px solid #dce5df;

    padding: 10px 10px 0;
}

.bar-container {
    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: end;

    align-items: center;

    width: 11%;
}

.bar {
    width: 32px;

    background: #087b45;

    border-radius: 4px 4px 0 0;

    min-height: 10px;
}

.bar-label {
    font-size: 9px;

    color: #7a847e;

    margin-top: 8px;

    margin-bottom: 5px;
}

/* PAYMENT BREAKDOWN */

.payment-row {
    margin-bottom: 20px;
}

.payment-info {
    display: flex;

    justify-content: space-between;

    margin-bottom: 7px;

    font-size: 11px;
}

.progress {
    height: 9px;

    background: #edf1ee;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {
    height: 100%;

    background: #087b45;

    border-radius: 20px;
}

/* TOP PRODUCTS */

.product-row {
    display: grid;

    grid-template-columns: 35px 1fr 80px;

    align-items: center;

    gap: 10px;

    padding: 12px 0;

    border-bottom: 1px solid #edf0ee;
}

.product-row:last-child {
    border-bottom: none;
}

.rank {
    width: 28px;

    height: 28px;

    border-radius: 50%;

    background: #e6f5ec;

    color: #087b45;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;

    font-size: 11px;
}

.product-info strong {
    display: block;

    font-size: 11px;
}

.product-info span {
    display: block;

    color: #89928c;

    font-size: 9px;

    margin-top: 3px;
}

.product-sales {
    text-align: right;

    font-size: 10px;

    font-weight: bold;
}

/* INVENTORY */

.inventory-grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 12px;
}

.inventory-item {
    padding: 15px;

    border: 1px solid #edf0ee;

    border-radius: 6px;
}

.inventory-item p {
    color: #89928c;

    font-size: 10px;

    margin-bottom: 7px;
}

.inventory-item h3 {
    font-size: 18px;
}

/* RESPONSIVE */

@media(max-width:1100px) {

    .summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .report-grid {
        grid-template-columns: 1fr;
    }

}

@media(max-width:700px) {

    .sidebar {
        width: 65px;
    }

    .sidebar-title,
    .menu span {
        display: none;
    }

    .menu a {
        justify-content: center;
    }

    .content {
        padding: 18px;
    }

    .summary {
        grid-template-columns: 1fr;
    }

    .filters {
        flex-direction: column;

        align-items: stretch;
    }

    .filter-group input,
    .filter-group select {
        width: 100%;
    }

    .inventory-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>
